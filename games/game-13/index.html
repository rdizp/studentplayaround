    <script>
        // Web Audio API Sound Effects Generator
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playMsgReceived() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08); // A5
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            }
            playMsgSent() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now); // A4
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08); // E5
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            }
            playPenalty() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        const soundFX = new SoundEngine();

        function toggleAudio() {
            soundFX.muted = !soundFX.muted;
            const icon = document.getElementById('soundIcon');
            if (soundFX.muted) {
                icon.className = 'fas fa-volume-mute text-red-400';
            } else {
                icon.className = 'fas fa-volume-up text-[#F4B400]';
                soundFX.playMsgSent();
            }
        }

        // APP STATE MANAGERS
        let currentState = {
            playerName: "Alex",
            selectedScenario: null,
            currentNodeKey: 'start',
            meters: {
                politeness: 70,
                clarity: 70,
                rapport: 70
            },
            selectedScenarioIndex: 0
        };

        // RENDER SETUP MODAL LIST
        function initSetupLobby() {
            const listEl = document.getElementById('scenarioList');
            listEl.innerHTML = '';

            SCENARIOS.forEach((sc, idx) => {
                const card = document.createElement('div');
                card.className = `p-3 rounded-lg border cursor-pointer transition-all flex items-center justify-between ${
                    currentState.selectedScenarioIndex === idx 
                        ? 'bg-[#132237] border-[#F4B400] text-[#F8F9FA] shadow-md' 
                        : 'bg-[#1E3A5F]/40 border-[#D9D9D9]/20 text-[#D9D9D9] hover:bg-[#132237]/60'
                }`;
                card.onclick = () => selectScenarioItem(idx);

                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-[#132237] border border-[#F4B400]/40 flex items-center justify-center font-bold text-xs text-[#F4B400]">
                            ${sc.avatar}
                        </div>
                        <div>
                            <div class="font-semibold text-xs md:text-sm text-[#F8F9FA]">${sc.title}</div>
                            <div class="text-[11px] text-[#D9D9D9]/70">${sc.contact} • ${sc.category}</div>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-xs ${currentState.selectedScenarioIndex === idx ? 'text-[#F4B400]' : 'text-[#D9D9D9]/30'}"></i>
                `;
                listEl.appendChild(card);
            });
        }

        function selectScenarioItem(index) {
            currentState.selectedScenarioIndex = index;
            initSetupLobby();
        }

        function pickRandomScenario() {
            const randIdx = Math.floor(Math.random() * SCENARIOS.length);
            selectScenarioItem(randIdx);
            soundFX.playMsgSent();
        }

        function openSetupModal() {
            document.getElementById('setupOverlay').classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeSetupModal() {
            document.getElementById('setupOverlay').classList.add('opacity-0', 'pointer-events-none');
        }

        function confirmScenarioSelection() {
            const nameInput = document.getElementById('playerNameInput').value.trim();
            if (nameInput) currentState.playerName = nameInput;

            currentState.selectedScenario = SCENARIOS[currentState.selectedScenarioIndex];
            currentState.currentNodeKey = 'start';
            currentState.meters = { politeness: 70, clarity: 70, rapport: 70 };

            closeSetupModal();
            updateUIHeader();
            updateMetersUI();
            
            // Clear chat log
            const chatLog = document.getElementById('chatLog');
            chatLog.innerHTML = '';

            // Post initial message
            showTypingIndicator(currentState.selectedScenario.contact, () => {
                appendChatMessage(currentState.selectedScenario.contact, currentState.selectedScenario.initialMsg, 'received');
                soundFX.playMsgReceived();
                renderChoices();
            });
        }

        function updateUIHeader() {
            const sc = currentState.selectedScenario;
            document.getElementById('contactName').textContent = sc.contact;
            document.getElementById('scenarioTitle').textContent = `${sc.title} (${sc.category})`;
            document.getElementById('contactAvatar').textContent = sc.avatar;
            document.getElementById('typingName').textContent = sc.contact;
        }

        function updateMetersUI() {
            // Clamp values 0 - 100
            currentState.meters.politeness = Math.max(0, Math.min(100, currentState.meters.politeness));
            currentState.meters.clarity = Math.max(0, Math.min(100, currentState.meters.clarity));
            currentState.meters.rapport = Math.max(0, Math.min(100, currentState.meters.rapport));

            // DOM Elements
            document.getElementById('politenessVal').textContent = `${currentState.meters.politeness}%`;
            document.getElementById('politenessBar').style.width = `${currentState.meters.politeness}%`;

            document.getElementById('clarityVal').textContent = `${currentState.meters.clarity}%`;
            document.getElementById('clarityBar').style.width = `${currentState.meters.clarity}%`;

            document.getElementById('rapportVal').textContent = `${currentState.meters.rapport}%`;
            document.getElementById('rapportBar').style.width = `${currentState.meters.rapport}%`;
        }

        function appendChatMessage(sender, text, type) {
            const chatLog = document.getElementById('chatLog');
            const msgWrapper = document.createElement('div');
            msgWrapper.className = `flex flex-col ${type === 'sent' ? 'items-end' : 'items-start'} animate-msg`;

            const isUser = type === 'sent';
            
            msgWrapper.innerHTML = `
                <div class="flex items-end gap-2 max-w-[85%] md:max-w-[75%] ${isUser ? 'flex-row-reverse' : 'flex-row'}">
                    <div class="w-7 h-7 rounded-full ${isUser ? 'bg-[#F4B400] text-[#1E3A5F]' : 'bg-[#1E3A5F] border border-[#D9D9D9]/30 text-[#F4B400]'} flex items-center justify-center font-bold text-xs shrink-0 shadow">
                        ${isUser ? currentState.playerName.charAt(0).toUpperCase() : currentState.selectedScenario.avatar}
                    </div>
                    <div class="${isUser ? 'bg-[#F4B400] text-[#1E3A5F] rounded-2xl rounded-br-none' : 'glass-panel text-[#F8F9FA] rounded-2xl rounded-bl-none'} px-4 py-2.5 shadow-md text-xs md:text-sm leading-relaxed">
                        <div class="font-bold text-[10px] opacity-75 mb-0.5">${sender}</div>
                        <div>${text}</div>
                    </div>
                </div>
            `;

            chatLog.appendChild(msgWrapper);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function showTypingIndicator(name, callback) {
            const typing = document.getElementById('typingIndicator');
            typing.classList.remove('hidden');
            const chatLog = document.getElementById('chatLog');
            chatLog.scrollTop = chatLog.scrollHeight;

            setTimeout(() => {
                typing.classList.add('hidden');
                if (callback) callback();
            }, 1100);
        }

        function renderChoices() {
            const container = document.getElementById('choicesContainer');
            container.innerHTML = '';

            const sc = currentState.selectedScenario;
            const currentChoices = sc.nodes[currentState.currentNodeKey];

            // If array of choices
            let options = [];
            if (Array.isArray(currentChoices)) {
                options = currentChoices;
            } else if (currentChoices && currentChoices.choices) {
                options = currentChoices.choices;
            }

            if (!options || options.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-[#D9D9D9]/50 py-2">Simulation completed. Start a new scenario above.</p>`;
                return;
            }

            options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 rounded-xl bg-[#132237] hover:bg-[#132237]/80 border border-[#D9D9D9]/20 hover:border-[#F4B400]/60 text-[#F8F9FA] text-xs md:text-sm transition-all shadow hover:shadow-lg flex items-center justify-between group";
                
                btn.innerHTML = `
                    <span class="pr-2 leading-snug">${opt.text}</span>
                    <i class="fas fa-paper-plane text-[#F4B400] opacity-0 group-hover:opacity-100 transition-opacity text-xs shrink-0"></i>
                `;

                btn.onclick = () => handleChoiceSelect(opt);
                container.appendChild(btn);
            });
        }

        function handleChoiceSelect(option) {
            soundFX.playMsgSent();

            // Append User Message
            appendChatMessage(currentState.playerName, option.text, 'sent');

            // Adjust Social Meters
            currentState.meters.politeness += option.politeness || 0;
            currentState.meters.clarity += option.clarity || 0;
            currentState.meters.rapport += option.rapport || 0;

            if ((option.politeness || 0) < 0 || (option.rapport || 0) < 0) {
                soundFX.playPenalty();
            }

            updateMetersUI();

            // Clear choices while processing
            document.getElementById('choicesContainer').innerHTML = `<p class="text-center text-xs text-[#D9D9D9]/50 py-2">Waiting for response...</p>`;

            // Route to next node or ending
            const sc = currentState.selectedScenario;

            if (option.ending) {
                triggerEnding(option.ending, option.finalMsg);
            } else if (option.next) {
                currentState.currentNodeKey = option.next;
                const nextNode = sc.nodes[option.next];

                showTypingIndicator(sc.contact, () => {
                    appendChatMessage(sc.contact, nextNode.msg, 'received');
                    soundFX.playMsgReceived();
                    renderChoices();
                });
            }
        }

        function triggerEnding(endingType, finalReply) {
            const sc = currentState.selectedScenario;

            showTypingIndicator(sc.contact, () => {
                if (finalReply) {
                    appendChatMessage(sc.contact, finalReply, 'received');
                    soundFX.playMsgReceived();
                }

                setTimeout(() => {
                    // Create Banner Outcome
                    const chatLog = document.getElementById('chatLog');
                    const banner = document.createElement('div');
                    banner.className = "my-4 p-4 rounded-xl text-center border shadow-xl animate-msg max-w-lg mx-auto";

                    const avgMeter = Math.round((currentState.meters.politeness + currentState.meters.clarity + currentState.meters.rapport) / 3);

                    if (endingType === 'diplomat' && avgMeter >= 60) {
                        banner.className += " bg-emerald-950/80 border-emerald-500/50 text-emerald-100";
                        banner.innerHTML = `
                            <div class="text-2xl mb-1">🌟</div>
                            <h3 class="font-bold text-base text-emerald-300 uppercase tracking-wider">Outcome: True Diplomat</h3>
                            <p class="text-xs mt-1 text-emerald-200">You navigated the conversation with high social intelligence, clarity, and respect.</p>
                            <div class="mt-2 text-xs font-semibold bg-emerald-900/60 py-1 px-3 rounded-full inline-block border border-emerald-500/30">Overall Social Score: ${avgMeter}%</div>
                        `;
                    } else if (endingType === 'burned' || avgMeter < 45) {
                        banner.className += " bg-red-950/80 border-red-500/50 text-red-100";
                        banner.innerHTML = `
                            <div class="text-2xl mb-1">🔥</div>
                            <h3 class="font-bold text-base text-red-300 uppercase tracking-wider">Outcome: Bridge Burned</h3>
                            <p class="text-xs mt-1 text-red-200">Defensive or disrespectful responses eroded trust, ending the interaction poorly.</p>
                            <div class="mt-2 text-xs font-semibold bg-red-900/60 py-1 px-3 rounded-full inline-block border border-red-500/30">Overall Social Score: ${avgMeter}%</div>
                        `;
                    } else {
                        banner.className += " bg-amber-950/80 border-amber-500/50 text-amber-100";
                        banner.innerHTML = `
                            <div class="text-2xl mb-1">⚡</div>
                            <h3 class="font-bold text-base text-amber-300 uppercase tracking-wider">Outcome: Awkward Friction</h3>
                            <p class="text-xs mt-1 text-amber-200">The dialogue reached a resolution, but lack of clarity or warmth left unresolved tension.</p>
                            <div class="mt-2 text-xs font-semibold bg-amber-900/60 py-1 px-3 rounded-full inline-block border border-amber-500/30">Overall Social Score: ${avgMeter}%</div>
                        `;
                    }

                    chatLog.appendChild(banner);
                    chatLog.scrollTop = chatLog.scrollHeight;

                    // Interaction panel restart button
                    document.getElementById('choicesContainer').innerHTML = `
                        <button onclick="openSetupModal()" class="w-full py-3 bg-[#F4B400] hover:bg-yellow-400 text-[#1E3A5F] font-bold rounded-xl shadow-lg text-sm transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-play"></i> Try Another Scenario
                        </button>
                    `;
                }, 600);
            });
        }

/* ==========================================================
   COURSE CONTEXT / NAVIGATION
   ========================================================== */

const GAME_CONTEXT = {
    course: 'english-practice',
    subcourse: null
};

const courseParams = new URLSearchParams(window.location.search);
const requestedCourse = courseParams.get('course');
const requestedSubCourse = courseParams.get('subcourse');

const backToCourseBtn = document.getElementById('backToCourseBtn');

if (backToCourseBtn) {
    const backParams = new URLSearchParams();

    backParams.set(
        'course',
        requestedCourse || GAME_CONTEXT.course
    );

    if (requestedSubCourse) {
        backParams.set('subcourse', requestedSubCourse);
    }

    backToCourseBtn.href = `../../?${backParams.toString()}`;
}

const hasCourseContext = requestedCourse || requestedSubCourse;

const validCourseContext =
    requestedCourse === GAME_CONTEXT.course &&
    requestedSubCourse === GAME_CONTEXT.subcourse;

if (hasCourseContext && !validCourseContext) {
    window.location.replace(
        './?course=' + encodeURIComponent(GAME_CONTEXT.course)
    );
}
        
        // INITIALIZE ON LOAD
        window.addEventListener('DOMContentLoaded', () => {
            initSetupLobby();
        });
    </script>
